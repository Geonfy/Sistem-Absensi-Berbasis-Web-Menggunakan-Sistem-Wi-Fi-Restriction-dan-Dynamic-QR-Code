<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Pengguna</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold">Daftar Pengguna Sistem</h2>
            <p class="text-muted">Proyek Capstone Sistem Absensi Dinamis</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">

                <table class="table table-striped table-hover table-bordered align-middle">
                    <thead class="table-dark">
                        <tr class="text-center">
                            <th>Nomor Induk</th>
                            <th>Nama Lengkap</th>
                            <th>Peran (Role)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pengguna : ${daftarMahasiswa}">
                            <td class="text-center fw-bold" th:text="${pengguna.nomorInduk}">NIM</td>
                            <td th:text="${pengguna.namaLengkap}">Nama</td>
                            <td class="text-center">
                                <span class="badge rounded-pill" 
                                      th:classappend="${pengguna.role.name() == 'ADMIN' ? 'text-bg-danger' : 
                                                       (pengguna.role.name() == 'DOSEN' ? 'text-bg-primary' : 'text-bg-success')}"
                                      th:text="${pengguna.role}">Role
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

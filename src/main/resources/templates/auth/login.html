<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Sistem Absensi QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h4 class="fw-bold">Login Sistem Presensi</h4>
            <p class="text-muted small">Wi-Fi Restriction & Dynamic QR Code</p>
        </div>

        <!-- Menampilkan pesan error berwarna merah jika login gagal atau Wi-Fi salah -->
        <div th:if="${error}" class="alert alert-danger text-center small" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nomor Induk (NIM / NIP / ID)</label>
                <input type="text" name="nomorInduk" class="form-control" placeholder="Masukkan Nomor Induk" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Masukkan Password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">Masuk</button>
        </form>
    </div>

</body>
</html>

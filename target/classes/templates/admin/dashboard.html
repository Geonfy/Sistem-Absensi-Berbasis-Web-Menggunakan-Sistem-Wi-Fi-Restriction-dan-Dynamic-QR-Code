<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard Admin - Sistem Presensi QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Portal Admin - Presensi QR</a>
            <div class="text-white">
                <span class="me-3 small">Halo, <strong th:text="${admin?.namaLengkap}">Admin</strong></span>
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div th:if="${pesanSukses}" class="alert alert-success fw-semibold shadow-sm" th:text="${pesanSukses}"></div>
        <div th:if="${pesanError}" class="alert alert-danger fw-semibold shadow-sm" th:text="${pesanError}"></div>

        <div class="row">
            <!-- Kolom Kiri: Form tambah -->
            <div class="col-lg-4 mb-4">

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white fw-bold">Tambah Pengguna</div>
                    <div class="card-body">
                        <form th:action="@{/admin/user/tambah}" method="post">
                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Nomor Induk (NIM / NIP / ID)</label>
                                <input type="text" name="nomorInduk" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Nama Lengkap</label>
                                <input type="text" name="namaLengkap" class="form-control" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Peran</label>
                                <select name="role" class="form-select" required>
                                    <option value="MAHASISWA">MAHASISWA</option>
                                    <option value="DOSEN">DOSEN</option>
                                    <option value="ADMIN">ADMIN</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Simpan Pengguna</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">Tambah Mata Kuliah</div>
                    <div class="card-body">
                        <form th:action="@{/admin/mk/tambah}" method="post">
                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Kode MK</label>
                                <input type="text" name="kodeMk" class="form-control" placeholder="Contoh: STSI4401" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-semibold">Nama Mata Kuliah</label>
                                <input type="text" name="namaMk" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">SKS</label>
                                <input type="number" name="sks" class="form-control" value="3" min="1" max="6" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Simpan Mata Kuliah</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Kolom Kanan: Tabel data -->
            <div class="col-lg-8">

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">Daftar Pengguna</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped align-middle mb-0">
                                <thead class="table-light text-center">
                                    <tr>
                                        <th>Nomor Induk</th>
                                        <th>Nama Lengkap</th>
                                        <th>Peran</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="u : ${daftarUser}">
                                        <td class="text-center fw-bold" th:text="${u.nomorInduk}">NIM</td>
                                        <td th:text="${u.namaLengkap}">Nama</td>
                                        <td class="text-center">
                                            <span class="badge rounded-pill"
                                                  th:classappend="${u.role.name() == 'ADMIN' ? 'text-bg-danger' :
                                                                   (u.role.name() == 'DOSEN' ? 'text-bg-primary' : 'text-bg-success')}"
                                                  th:text="${u.role}">Role</span>
                                        </td>
                                        <td class="text-center">
                                            <form th:action="@{'/admin/user/' + ${u.id} + '/hapus'}" method="post"
                                                  onsubmit="return confirm('Hapus pengguna ini?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger">Hapus</button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">Daftar Mata Kuliah</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered table-striped align-middle mb-0">
                                <thead class="table-light text-center">
                                    <tr>
                                        <th>Kode</th>
                                        <th>Nama Mata Kuliah</th>
                                        <th>SKS</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="mk : ${daftarMk}">
                                        <td class="text-center fw-bold" th:text="${mk.kodeMk}">Kode</td>
                                        <td th:text="${mk.namaMk}">Nama</td>
                                        <td class="text-center" th:text="${mk.sks}">3</td>
                                        <td class="text-center">
                                            <form th:action="@{'/admin/mk/' + ${mk.id} + '/hapus'}" method="post"
                                                  onsubmit="return confirm('Hapus mata kuliah ini?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger">Hapus</button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>

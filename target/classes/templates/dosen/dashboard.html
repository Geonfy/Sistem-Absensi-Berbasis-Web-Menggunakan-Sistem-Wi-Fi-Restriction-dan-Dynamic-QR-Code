<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Dosen - Sistem Presensi QR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Portal Dosen - Presensi QR</a>
            <div class="text-white">
                <span class="me-3 small">Halo, <strong th:text="${dosen?.namaLengkap}">Dosen</strong></span>
                <a th:href="@{/logout}" class="btn btn-light btn-sm fw-bold text-primary">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Form Buka Sesi Kelas -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white fw-bold">Buka Sesi Kelas Baru</div>
                    <div class="card-body">
                        <form th:action="@{/dosen/sesi/buat}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Pilih Mata Kuliah</label>
                                <select name="mataKuliahId" class="form-select" required>
                                    <option th:each="mk : ${daftarMk}" th:value="${mk.id}" 
                                            th:text="${mk.kodeMk + ' - ' + mk.namaMk}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Pertemuan Ke-</label>
                                <input type="number" name="pertemuanKe" class="form-control" value="1" min="1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Ruangan Kelas</label>
                                <input type="text" name="ruangan" class="form-control" placeholder="Contoh: R.301 / Lab Komputer" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">
                                Buka Kelas & Tampilkan QR
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabel Riwayat Sesi Kelas -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">Daftar Sesi Kelas Anda</div>
                    <div class="card-body">
                        <table class="table table-bordered table-hover align-middle mb-0">
                            <thead class="table-light text-center">
                                <tr>
                                    <th>Mata Kuliah</th>
                                    <th>Pertemuan</th>
                                    <th>Ruangan</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${daftarSesi}">
                                    <td th:text="${s.mataKuliah?.namaMk}">Nama MK</td>
                                    <td class="text-center" th:text="${'Ke-' + s.pertemuanKe}">1</td>
                                    <td class="text-center" th:text="${s.ruangan}">R.301</td>
                                    <td class="text-center">
                                        <a th:href="@{'/dosen/sesi/' + ${s.id} + '/qr'}" class="btn btn-sm btn-success fw-bold">
                                            Tampilkan Dynamic QR
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
